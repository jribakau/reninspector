[package]
name = "vn-ide"
version = "0.1.0"
description = "Ren'Inspector: inspect, edit and run Ren'Py games, in development or already released"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.82"
publish = false

[workspace]
members = [".", "renpy-core"]
resolver = "2"

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"

[lints]
workspace = true

[lib]
name = "vn_ide_lib"
crate-type = ["rlib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
notify = "6"
renpy-core = { path = "renpy-core" }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
crc32fast = "1.3"
diffy = "0.4"
spellbook = "0.4.2"
flate2 = "1"
tar = "0.4"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.renpy-core]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
