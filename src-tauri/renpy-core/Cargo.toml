[package]
name = "renpy-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
serde_json = "1.0"
flate2 = "1.0"
crc32fast = "1.3"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.0"
crc32fast = "1.3"

