name: Release

# Push a tag such as v0.1.0 to build the Windows installer and attach it to a
# draft release. Review the draft on GitHub, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ren'Inspector ${{ github.ref_name }}"
          releaseBody: |
            Windows installer for Ren'Inspector.

            The installer is not code-signed, so Windows SmartScreen may warn on first
            launch. Choose "More info", then "Run anyway".

            This is an early version. Ren'Inspector is an independent tool and is not
            affiliated with the Ren'Py project.
          releaseDraft: true
          prerelease: true
