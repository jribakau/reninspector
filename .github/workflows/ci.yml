name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type check and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The app was written and tested on Windows. The other systems report problems
    # without blocking a merge until they are known to pass.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux libraries for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # The app crate embeds the built frontend, so build it first.
      - run: npm run build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: renpy-core tests
        working-directory: src-tauri/renpy-core
        shell: bash
        run: |
          # GitHub runs bash with -e and pipefail, which would stop this script at the
          # first failing command before it reports anything.
          set +e +o pipefail
          log=$(mktemp)
          cargo test --all-targets --no-fail-fast 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -E '^test .* FAILED|panicked at|^error' "$log" || tail -n 12 "$log"; } \
              | head -n 10 \
              | while IFS= read -r line; do echo "::error::${line%$'\r'}"; done
          fi
          exit "$status"
      - name: App tests
        working-directory: src-tauri
        shell: bash
        run: |
          set +e +o pipefail
          log=$(mktemp)
          cargo test --no-fail-fast 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { grep -E '^test .* FAILED|panicked at|^error' "$log" || tail -n 12 "$log"; } \
              | head -n 10 \
              | while IFS= read -r line; do echo "::error::${line%$'\r'}"; done
          fi
          exit "$status"
      - name: Release compile
        # One non-Windows system is enough to catch a release-only break.
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo build --release -p vn-ide
