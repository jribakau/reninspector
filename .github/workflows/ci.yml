name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type check and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The app was written and tested on Windows. The other systems report problems
    # without blocking a merge until they are known to pass.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/renpy-core
      - name: Install Linux libraries for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      # The app crate embeds the built frontend, so build it first.
      - run: npm run build
      - name: renpy-core tests
        working-directory: src-tauri/renpy-core
        shell: bash
        run: |
          cargo test --all-targets --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E '^test .* FAILED|panicked at|^error' test.log | head -20 | while IFS= read -r line; do echo "::error::${line%$'\r'}"; done
          exit "$status"
      - name: App tests
        working-directory: src-tauri
        shell: bash
        run: |
          cargo test --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E '^test .* FAILED|panicked at|^error' test.log | head -20 | while IFS= read -r line; do echo "::error::${line%$'\r'}"; done
          exit "$status"
